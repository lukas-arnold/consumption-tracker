<!DOCTYPE html>
<html lang='{{T "language"}}'>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consumption Tracker</title>
  <link rel="icon" type="image/x-icon" href="/web/assets/favicon.ico">
  <link rel="manifest" href="/web/manifest.json">
  <link rel="stylesheet" href="/web/css/pico.min.css">
  <link rel="stylesheet" href="/web/css/style.css">
  <link rel="stylesheet" href="/web/assets/fontawesome/css/fontawesome.min.css">
  <link rel="stylesheet" href="/web/assets/fontawesome/css/solid.min.css">
  <script src="/web/js/format.js" defer></script>
  <script src="/web/js/dates.js" defer></script>
</head>

<body>

  <header class="container">
    <nav>
      <ul>
        <li><strong>Consumption Tracker</strong></li>
      </ul>
      <ul>
        <li><a href="/electricity">{{T "electricity"}}</a></li>
        <li><a href="/oil">{{T "oil"}}</a></li>
        <li><a href="/water">{{T "water"}}</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <h1 class="center">{{T "addOilFillLevel"}}</h1>

    <form action="/oil-fill-level/add" method="POST">
      <label for="date">{{T "date"}}</label>
      <input type="date" id="date" name="date" required>

      <label for="level">{{T "level"}} (cm)</label>
      <input type="number" step="0.1" id="level" name="level" placeholder='{{T "level"}}' required>

      <input type="submit" value='{{T "save"}}' style="width: 100%;" />
    </form>
  </main>

</body>

</html>
