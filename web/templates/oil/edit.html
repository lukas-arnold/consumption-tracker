<!DOCTYPE html>
<html lang='{{T "language"}}'>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consumption Tracker</title>
  <link rel="stylesheet" href="/web/css/pico.min.css">
</head>

<body>

  <header class="container">
    <nav>
      <ul>
        <li><strong>Consumption Tracker</strong></li>
      </ul>
      <ul>
        <li><a href="/electricity">{{T "electricity"}}</a></li>
        <li><a href="/oil">{{T "oil"}}</a></li>
        <li><a href="/water">{{T "water"}}</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <h1 class="center">{{T "editOil"}}</h1>
    <form action="/oil/save/{{.Id}}" method="POST">
      <input type="date" name="date" value="{{.Date}}" required>
      <input type="number" step="1" name="volume" value="{{.Volume}}" placeholder='{{T "volume"}}' required>
      <input type="number" step="0.01" name="costs" value="{{.Costs}}" placeholder='{{T "costs"}}' required>
      <input type="text" name="retailer" value="{{.Retailer}}" placeholder='{{T "retailer"}}' required>
      <textarea name="note" placeholder='{{T "note"}}'>{{.Note}}</textarea>
      <input type="submit" value='{{T "save"}}'>
    </form>
  </main>

</body>

</html>
