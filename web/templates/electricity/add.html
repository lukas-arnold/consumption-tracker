{{define "template"}}
<h1 class="center">{{T "addElectricity"}}</h1>
<form action="/electricity/add" method="POST">
	<input type="date" name="timeFrom" id="lastYearStart" required>
	<input type="date" name="timeTo" id="lastYearEnd" required>
	<input type="number" step="1" name="consumption" placeholder='{{T "consumption"}}' required>
	<input type="number" step="0.01" name="costs" placeholder='{{T "costs"}}' required>
	<input type="text" name="retailer" placeholder='{{T "retailer"}}' required>
	<input type="number" step="0.01" name="payments" placeholder='{{T "payments"}}' required>
	<textarea name="note" placeholder='{{T "note"}}'></textarea>
	<input type="submit" value='{{T "save"}}' style="width:100%;">
</form>
{{end}}
