{{define "template"}}
<h1 class="center">{{T "editElectricity"}}</h1>
<form action="/electricity/save/{{.Id}}" method="POST">
	<input type="date" name="timeFrom" value="{{.TimeFrom}}" required>
	<input type="date" name="timeTo" value="{{.TimeTo}}" required>
	<input type="number" step="1" name="consumption" value="{{.Consumption}}" placeholder='{{T "consumption"}}' required>
	<input type="number" step="0.01" name="costs" value="{{.Costs}}" placeholder='{{T "costs"}}' required>
	<input type="text" name="retailer" value="{{.Retailer}}" placeholder='{{T "retailer"}}' required>
	<input type="number" step="0.01" name="payments" value="{{.Payments}}" placeholder='{{T "payments"}}' required>
	<textarea name="note" placeholder='{{T "note"}}'>{{.Note}}</textarea>
	<input type="submit" value='{{T "save"}}'>
</form>
{{end}}
